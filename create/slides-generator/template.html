<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- TITLE_PLACEHOLDER --></title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@500;600;700;800&family=Golos+Text:wght@400;500;600;700&family=Lora:ital,wght@1,400;1,500&display=swap');
  :root{
    --bg:#080a0c;--bg2:#0e1117;--fg:#e8eaf0;--muted:#a7adbe;--dim:#5b6276;
    --green:#4ade80;--green-lo:rgba(74,222,128,.1);--amber:#fbbf24;--blue:#38bdf8;--violet:#c084fc;--pink:#f472b6;--orange:#fb923c;
    --card:#111318;--card2:#181c25;--line:#1e232f;--red:#f87171;
    --font-display:'Unbounded',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-head:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-body:'Golos Text',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --body-size:clamp(1.1rem,1.6vw,1.42rem);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--fg);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
  .deck{position:fixed;inset:0}
  /* 50/50: текст — левая половина, визуал — правая половина */
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:8vh 52vw 8vh 8vw;opacity:0;transition:opacity .32s ease;isolation:isolate}
  .slide.active{display:flex;opacity:1}
  .slide>*{max-width:100%}
  .art{position:absolute;right:0;top:0;width:50%;height:100%;pointer-events:none;z-index:-1;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .art svg{width:88%;height:86%;max-width:580px;max-height:720px}
  .art.mir svg{transform:scaleX(-1)}
  @media (max-aspect-ratio:1/1),(max-width:820px){ .slide{padding:7vh 7vw} .art{display:none} }

  .kicker{font-family:var(--font-head);font-size:clamp(.72rem,1.05vw,.9rem);letter-spacing:.2em;text-transform:uppercase;color:var(--green);font-weight:700;margin-bottom:1.5rem}
  h1{font-family:var(--font-display);font-size:clamp(2.1rem,4.7vw,4.3rem);line-height:1.16;letter-spacing:-.01em;font-weight:700}
  h1 .g{color:var(--fg)}
  h2{font-family:var(--font-display);font-size:clamp(1.55rem,2.8vw,2.4rem);line-height:1.2;letter-spacing:-.01em;font-weight:700;margin-bottom:2.1rem}
  h2 .g{color:var(--fg)}
  h3{font-family:var(--font-display);font-size:clamp(1.25rem,1.9vw,1.72rem);line-height:1.16;letter-spacing:-.01em;font-weight:700;margin-bottom:1.05rem}
  h4{font-family:var(--font-display);font-size:clamp(1.02rem,1.5vw,1.36rem);line-height:1.18;letter-spacing:-.005em;font-weight:600;margin-bottom:.65rem}
  .g,.g2,.g3{color:#fff;-webkit-box-decoration-break:clone;box-decoration-break:clone;border-radius:4px;padding:0 .14em .1em;line-height:inherit}
  .g{background:rgba(74,222,128,.30)}
  .g2{background:rgba(251,191,36,.30)}
  .g3{background:rgba(248,113,113,.32)}
  .lead{font-size:var(--body-size);color:var(--muted);line-height:1.5;max-width:42ch;margin-top:1.5rem}
  .meta{margin-top:2.2rem;color:var(--dim);font-size:clamp(.9rem,1.25vw,1.08rem);line-height:1.9}
  .meta b{color:var(--fg);font-weight:600}
  .meta .sep{color:var(--dim);padding:0 .4rem}
  ul{list-style:none;display:flex;flex-direction:column;gap:.85rem;max-width:46ch}
  li{position:relative;padding-left:1.5rem;font-size:clamp(1.1rem,1.6vw,1.42rem);line-height:1.55;color:var(--fg);margin-bottom:.42rem}
  li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--green)}
  li b,li strong{font-weight:680;color:#fff}
  li .sub{display:block;color:var(--fg);font-size:var(--body-size);margin-top:.45rem;line-height:1.55}
  li.dim::before{background:var(--dim)}
  li.warn::before{background:var(--amber)}
  .hosts{display:grid;grid-template-columns:1fr;gap:1.4rem;max-width:none}
  .host-name{font-size:clamp(1.2rem,2vw,1.7rem);font-weight:700;color:#fff;margin-bottom:.25rem}
  .host-role{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--green);font-weight:600;margin-bottom:.6rem}
  .host-facts{display:flex;flex-direction:column;gap:.25rem}
  .host-fact{font-size:clamp(.82rem,1.3vw,1rem);color:var(--muted);line-height:1.3}
  .host-fact b{color:var(--fg);font-weight:600}
  .host-signal{margin-top:.7rem;font-size:clamp(.82rem,1.3vw,1rem);color:var(--fg);font-style:italic;line-height:1.35;border-left:2px solid var(--amber);padding-left:.8rem}
  .route{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;margin-bottom:1.8rem}
  .route-step{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.4rem .8rem;font-size:clamp(.8rem,1.2vw,1rem);color:var(--fg);font-weight:500}
  .route-step.hi{border-color:var(--green);color:var(--green);background:var(--green-lo)}
  .route-arr{color:var(--dim);font-size:1.05rem}
  .cal{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;max-width:none}
  .cal-day{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;display:flex;gap:.5rem;align-items:baseline}
  .cal-day .cn{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
  .cal-day .cd{font-size:.7rem;color:var(--muted);min-width:3.2em}
  .cal-day .ct{font-size:.74rem;color:var(--fg);line-height:1.2}
  .cal-day.live{border-color:var(--green);background:var(--green-lo)}
  .cal-day.live .cn{color:var(--green)}.cal-day.live .ct{color:#fff;font-weight:600}
  .cal-day.oh{border-color:var(--amber)}.cal-day.oh .cn{color:var(--amber)}
  .cal-day.demo{border-color:var(--amber)}.cal-day.demo .cn{color:var(--amber)}
  .focus-box{background:var(--green-lo);border:1.5px solid var(--green);border-radius:16px;padding:1.8rem 2.1rem;max-width:none;margin-top:.3rem}
  .focus-box .fb-kicker{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--green);font-weight:600;margin-bottom:.7rem}
  .focus-box .fb-body{font-size:clamp(1.25rem,2vw,1.8rem);font-weight:600;color:#fff;line-height:1.25;letter-spacing:-.01em}
  .focus-box .fb-sub{margin-top:.7rem;color:var(--muted);font-size:clamp(.9rem,1.4vw,1.15rem);line-height:1.4}
  .demo-list{display:flex;flex-direction:column;gap:.7rem;max-width:none}
  .demo-item{display:flex;align-items:flex-start;gap:.9rem;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:.8rem 1.1rem}
  .demo-item .di-num{font-size:.72rem;font-weight:700;color:var(--amber);min-width:1.5rem;padding-top:.1rem}
  .demo-item .di-body{flex:1}
  .demo-item .di-title{font-family:var(--font-display);font-size:clamp(.95rem,1.4vw,1.18rem);font-weight:600;color:#fff;margin-bottom:.15rem;letter-spacing:-.005em}
  .demo-item .di-desc{font-size:var(--body-size);color:var(--muted);line-height:1.38}
  .hw-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.3rem 1.6rem;max-width:none;margin-top:.3rem}
  .hw-box .hw-label{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--green);font-weight:600;margin-bottom:.7rem}
  .hw-task{display:flex;align-items:flex-start;gap:.8rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
  .hw-task:last-child{border-bottom:none;padding-bottom:0}
  .hw-task .hk{font-size:.72rem;font-weight:700;color:var(--amber);min-width:1.8rem}
  .hw-task .hv{font-size:clamp(.88rem,1.4vw,1.1rem);color:var(--fg);line-height:1.3}
  .hw-task .hv span{color:var(--muted);font-size:.85em}
  .qa-big{font-family:var(--font-display);font-size:clamp(3rem,7vw,6rem);font-weight:800;letter-spacing:-.03em;color:var(--amber);line-height:1;margin-bottom:.4rem}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;max-width:none}
  .cards.g3{grid-template-columns:repeat(2,1fr)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem}
  .card .ct{font-family:var(--font-display);font-weight:600;color:var(--green);font-size:clamp(1.02rem,1.5vw,1.36rem);margin-bottom:.42rem;letter-spacing:-.005em}
  .card .cd{color:var(--fg);font-size:var(--body-size);line-height:1.42}
  .card .tag{display:inline-block;margin-top:.6rem;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--green);font-weight:600}
  .card .tag.opt{color:var(--dim)}
  .card .ck{color:var(--green);font-weight:800;margin-right:.4rem}
  .arc{display:grid;grid-template-columns:1fr 1fr;gap:2.4rem;max-width:none}
  .arc-col{background:none;border:none;border-radius:0;padding:0}
  .arc-week{font-family:var(--font-display);font-size:clamp(1.1rem,1.7vw,1.4rem);letter-spacing:-.01em;text-transform:none;color:#fff;font-weight:700;margin-bottom:.9rem}
  .arc-col.w1 .arc-week{color:var(--green)}.arc-col.w2 .arc-week{color:var(--amber)}
  .arc-theme{font-family:var(--font-head);font-size:clamp(1.05rem,1.7vw,1.4rem);font-weight:700;color:#fff;margin-bottom:.7rem;line-height:1.15}
  .arc-col ul{gap:.7rem;max-width:none}
  .arc-col li{font-size:var(--body-size)}
  .arc-col.w1 li::before{background:var(--green)}.arc-col.w2 li::before{background:var(--amber)}
  .src{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;max-width:none}
  .src-item{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:.75rem .95rem}
  .src-item .si-t{font-weight:650;color:#fff;font-size:clamp(.82rem,1.3vw,1.02rem);margin-bottom:.2rem}
  .src-item .si-d{color:var(--muted);font-size:clamp(.82rem,1.15vw,.95rem);line-height:1.35}
  .sec-num{font-size:clamp(.7rem,1vw,.85rem);letter-spacing:.22em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:1.1rem;display:flex;align-items:center;gap:.6rem}
  .sec-num::before{content:"";width:24px;height:2px;background:var(--amber);border-radius:2px}
  .sec-title{font-family:var(--font-display);font-size:clamp(2.1rem,5.2vw,4rem);font-weight:700;color:#fff;letter-spacing:-.015em;line-height:1.16}
  .sec-title .g2{color:var(--fg)}
  .sec-sub{margin-top:1.5rem;font-size:clamp(1rem,1.6vw,1.35rem);color:var(--muted);max-width:30ch;line-height:1.5}
  .progress{position:fixed;left:0;top:0;height:2px;background:linear-gradient(90deg,var(--green),var(--amber));transition:width .32s;z-index:30;box-shadow:0 0 10px rgba(74,222,128,.4)}
  #auto-bar{position:fixed;left:0;top:0;height:2px;width:0;background:rgba(251,191,36,.55);z-index:31;pointer-events:none;transition:none}
  #auto-bar.running{animation:auto-count 20s linear forwards}
  #auto-bar.running.fast{animation:auto-count 7s linear forwards}
  @keyframes auto-count{from{width:100%}to{width:0}}
  @keyframes hr-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes hr-pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(4);opacity:.08}}
  @keyframes hr-color{0%,100%{fill:#4ade80}25%{fill:#fbbf24}50%{fill:#38bdf8}75%{fill:#c084fc}}
  #auto-btn,#fast-btn{background:none;border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.38);border-radius:5px;padding:.22rem .7rem;font-size:.65rem;font-family:var(--font-body);cursor:pointer;letter-spacing:.06em;transition:color .2s,border-color .2s;white-space:nowrap}
  #auto-btn:hover,#fast-btn:hover{color:rgba(255,255,255,.65);border-color:rgba(255,255,255,.3)}
  #auto-btn.on{color:var(--amber);border-color:rgba(251,191,36,.5)}
  #fast-btn.on{color:var(--green);border-color:rgba(74,222,128,.5)}
  .counter{position:fixed;right:2.2vw;bottom:1.8vh;color:var(--dim);font-size:.8rem;font-variant-numeric:tabular-nums;z-index:30;letter-spacing:.05em}
  .brand{position:fixed;left:2.2vw;bottom:1.8vh;color:var(--dim);font-size:.72rem;z-index:30;letter-spacing:.12em;text-transform:uppercase}
  .hint{position:fixed;right:2.2vw;top:1.6vh;color:var(--dim);font-size:.68rem;z-index:30;opacity:.55}
  .navbottom{position:fixed;left:50%;bottom:1.8vh;transform:translateX(-50%);display:flex;align-items:center;gap:1.6rem;z-index:30}
  .dots{display:flex;gap:6px}
  .dots button{width:6px;height:6px;border-radius:50%;border:none;background:var(--line);cursor:pointer;padding:0;transition:background .2s,transform .2s}
  .dots button.on{background:var(--green);transform:scale(1.4)}
  .notes{position:fixed;left:0;right:0;bottom:0;max-height:40vh;overflow:auto;background:rgba(6,7,10,.97);border-top:1px solid var(--line);padding:1.4rem 9vw 1.8rem;z-index:40;transform:translateY(100%);transition:transform .28s ease}
  .notes.show{transform:translateY(0)}
  .notes h4{color:var(--green);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;margin-bottom:.6rem}
  .notes p{color:#c8cdd8;font-size:.95rem;line-height:1.55;max-width:80ch}

  /* === Полноширинные раскладки (без бокового арта) === */
  .slide.wide{padding:7vh 7vw 6vh 7vw;justify-content:safe center}
  .slide.wide>*{max-width:none}
  .slide.wide>.hexring{flex:1;height:auto;min-height:50vh}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:2.2rem 2.6rem;margin-top:.6rem;max-width:none}
  .pcard{background:none;border:none;padding:0}
  .ic{display:block;flex:none}
  .pcard .ic{width:clamp(38px,3.3vw,50px);height:clamp(38px,3.3vw,50px);margin-bottom:1rem}
  .pcard .pt{font-family:var(--font-head);font-size:clamp(1.08rem,1.7vw,1.42rem);font-weight:700;color:#fff;margin-bottom:.5rem;line-height:1.14}
  .pcard .pd{color:var(--muted);font-size:var(--body-size);line-height:1.42}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:1.8rem;max-width:none}
  .cols2 .grp-label{font-family:var(--font-head);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:.7rem}
  .cards.g3w{grid-template-columns:repeat(3,1fr)}
  /* Однорядные сетки во всю ширину (вместо 2×2) */
  .cards.g4{grid-template-columns:repeat(4,1fr);gap:2.4rem 3rem}
  .cards.g5{grid-template-columns:repeat(5,1fr);gap:1.4rem 2rem}
  .pgrid.row4{grid-template-columns:repeat(4,1fr)}
  .demo-list.two{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
  /* колонка-карточка с номером для однорядных сеток */
  .colcard{background:none;border:none;padding:0;display:flex;flex-direction:column;gap:.4rem}
  .colcard .ic{width:clamp(34px,2.9vw,44px);height:clamp(34px,2.9vw,44px);margin-bottom:.4rem}
  .colcard .ch{font-family:var(--font-display);font-weight:600;color:#fff;font-size:clamp(1rem,1.45vw,1.3rem);line-height:1.16;letter-spacing:-.005em}
  .colcard .cb{color:var(--muted);font-size:var(--body-size);line-height:1.42}
  /* безрамочные карточки — по умолчанию предпочитаем их + воздух, а не залитые блоки с border */
  /* 4-colour cycling: .nn AND .nh always same color per column */
  .cards .card:nth-child(4n+1) .ct,.pgrid .numcard:nth-child(4n+1) .nn,.pgrid .numcard:nth-child(4n+1) .nh,.numgrid .numcard:nth-child(4n+1) .nn,.numgrid .numcard:nth-child(4n+1) .nh,.cards.g5 .numcard:nth-child(5n+1) .nn,.cards.g5 .numcard:nth-child(5n+1) .nh{color:var(--green)}
  .cards .card:nth-child(4n+2) .ct,.pgrid .numcard:nth-child(4n+2) .nn,.pgrid .numcard:nth-child(4n+2) .nh,.numgrid .numcard:nth-child(4n+2) .nn,.numgrid .numcard:nth-child(4n+2) .nh,.cards.g5 .numcard:nth-child(5n+2) .nn,.cards.g5 .numcard:nth-child(5n+2) .nh{color:var(--amber)}
  .cards .card:nth-child(4n+3) .ct,.pgrid .numcard:nth-child(4n+3) .nn,.pgrid .numcard:nth-child(4n+3) .nh,.numgrid .numcard:nth-child(4n+3) .nn,.numgrid .numcard:nth-child(4n+3) .nh,.cards.g5 .numcard:nth-child(5n+3) .nn,.cards.g5 .numcard:nth-child(5n+3) .nh{color:var(--blue)}
  .cards .card:nth-child(4n+4) .ct,.pgrid .numcard:nth-child(4n+4) .nn,.pgrid .numcard:nth-child(4n+4) .nh,.numgrid .numcard:nth-child(4n+4) .nn,.numgrid .numcard:nth-child(4n+4) .nh,.cards.g5 .numcard:nth-child(5n+4) .nn,.cards.g5 .numcard:nth-child(5n+4) .nh{color:var(--violet)}
  .cards.g5 .numcard:nth-child(5n+5) .nn,.cards.g5 .numcard:nth-child(5n+5) .nh{color:var(--green)}
  .cards.bare{gap:2.4rem 3rem}
  .cards.bare .card{background:none;border:none;padding:0}
  .numgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4rem 3rem;max-width:none;margin-top:.6rem}
  .hexring{position:relative;height:62vh;width:100%;margin-top:.6rem}
  .hexring .hr-ring{position:absolute;left:13%;top:6%;width:74%;height:88%;border:1px solid rgba(255,255,255,.18);border-radius:50%;pointer-events:none;box-shadow:inset 0 0 60px rgba(74,222,128,.03)}
  .hexring .hr-item{position:absolute;width:24%;text-align:center}
  .hexring .hr-n{font-family:var(--font-display);font-size:clamp(1.5rem,2.3vw,2.1rem);font-weight:700;line-height:1;margin-bottom:.22rem}
  .hexring .hr-t{font-family:var(--font-display);font-size:clamp(.8rem,1.15vw,.98rem);font-weight:600;color:#fff;letter-spacing:-.005em;line-height:1.15;margin-bottom:.25rem}
  .hexring .hr-d{font-size:clamp(.73rem,1vw,.88rem);color:rgba(255,255,255,.6);line-height:1.4}
  .numcard .nn{font-family:var(--font-display);font-size:clamp(1.9rem,2.8vw,2.7rem);font-weight:700;color:var(--green);line-height:1;margin-bottom:.55rem}
  .numcard .nh{font-family:var(--font-display);font-weight:600;font-size:clamp(1.02rem,1.5vw,1.32rem);margin-bottom:.5rem;line-height:1.16;letter-spacing:-.005em}
  .bq{font-family:'Lora',Georgia,serif;font-style:italic;font-size:var(--body-size);line-height:1.65;border-left:3px solid currentColor;padding-left:1.2rem;color:var(--fg);margin:.7rem 0 .6rem}
  .numcard .nb{color:var(--fg);font-size:var(--body-size);line-height:1.42}
  /* стрелочные подпункты под буллетом */
  .subs{list-style:none;margin:.55rem 0 0;padding:0;display:flex;flex-direction:column;gap:.4rem;max-width:none}
  .subs li{position:relative;padding-left:1.4rem;font-size:clamp(.87rem,1.2vw,1.04rem);line-height:1.35;color:var(--muted)}
  .subs li::before{content:"\2192";position:absolute;left:0;top:0;width:auto;height:auto;background:none;border-radius:0;color:var(--green);font-weight:700}
  .subs li b{color:#fff;font-weight:600}
  /* горизонтальная последовательность с → между шагами */
  .seq{display:flex;align-items:flex-start;gap:.4rem;margin-top:.9rem;max-width:none}
  .seq-card{flex:1;min-width:0}
  .seq-arr{flex:none;color:var(--dim);font-size:1.05rem;padding-top:1.7rem;opacity:.65;line-height:1}
  .seq-card .sn{font-family:var(--font-display);font-size:clamp(1.5rem,2.3vw,2.2rem);color:var(--green);/* overridden by nth */;line-height:1;margin-bottom:.35rem;font-weight:700}
  .seq-card .st{font-family:var(--font-display);font-weight:600;color:#fff;font-size:clamp(.95rem,1.45vw,1.22rem);margin-bottom:.3rem;line-height:1.15;letter-spacing:-.005em}
  .seq-card .sd{color:var(--fg);font-size:clamp(.9rem,1.35vw,1.12rem);line-height:1.42}
  .seq .seq-card:nth-child(2n+1) .sn{color:var(--green)}
  .seq .seq-card:nth-child(4n+3) .sn{color:var(--blue)}
  .seq .seq-card:nth-child(6n+5) .sn{color:var(--amber)}
  /* 6 cards: 01 green 02 blue 03 amber 04 violet 05 green 06 blue */
  .seq .seq-card:nth-child(1) .sn{color:var(--green)}
  .seq .seq-card:nth-child(2) .sn{color:var(--blue)}
  .seq .seq-card:nth-child(3) .sn{color:var(--amber)}
  .seq .seq-card:nth-child(4) .sn{color:var(--violet)}
  .seq .seq-card:nth-child(5) .sn{color:var(--green)}
  .seq .seq-card:nth-child(6) .sn{color:var(--blue)}
</style>

<div class="progress" id="progress"></div>
<div id="auto-bar"></div>
<div class="brand"><!-- BRAND_PLACEHOLDER --></div>
<div class="hint">← → навигация · N заметки · F фуллскрин</div>
<div class="counter" id="counter">01 / 21</div>
<div class="navbottom"><button id="auto-btn">AUTOPLAY ›</button><div class="dots" id="dots"></div><button id="fast-btn">FAST PLAY ››</button></div>
<div class="deck" id="deck">
<!-- SLIDES_PLACEHOLDER -->

</div>
<div class="notes" id="notes"><h4>Спикерские заметки</h4><p id="notes-body"></p></div>
<script>
  const slides=Array.from(document.querySelectorAll('.slide'));
  const total=slides.length;
  let i=0;
  const prog=document.getElementById('progress');
  const counter=document.getElementById('counter');
  const notes=document.getElementById('notes');
  const notesBody=document.getElementById('notes-body');
  const dotsWrap=document.getElementById('dots');
  slides.forEach((_,idx)=>{const b=document.createElement('button');b.addEventListener('click',()=>go(idx));dotsWrap.appendChild(b)});
  const dots=Array.from(dotsWrap.children);
  function pad(n){return String(n).padStart(2,'0')}
  function render(){
    slides.forEach((s,idx)=>s.classList.toggle('active',idx===i));
    prog.style.width=((i+1)/total*100)+'%';
    counter.textContent=pad(i+1)+' / '+pad(total);
    dots.forEach((d,idx)=>d.classList.toggle('on',idx===i));
    notesBody.textContent=slides[i].dataset.notes||'';
    history.replaceState(null,'','#slide-'+(i+1));
  }
  // Auto-present
  let autoPlay=false,autoFast=false,autoTimer=null;
  const autoBtn=document.getElementById('auto-btn');
  const fastBtn=document.getElementById('fast-btn');
  const autoBar=document.getElementById('auto-bar');
  function restartAutoBar(){autoBar.classList.remove('running','fast');void autoBar.offsetWidth;autoBar.classList.add('running');if(autoFast)autoBar.classList.add('fast');}
  function stopAuto(){autoPlay=false;autoFast=false;clearTimeout(autoTimer);autoBar.classList.remove('running','fast');autoBtn.classList.remove('on');fastBtn.classList.remove('on');}
  function tickAuto(){const delay=autoFast?7000:20000;autoTimer=setTimeout(()=>{if(!autoPlay)return;if(i<total-1){go(i+1,true);restartAutoBar();tickAuto();}else{stopAuto();}},delay);}
  function startAuto(fast){if(autoPlay)stopAuto();autoPlay=true;autoFast=!!fast;(fast?fastBtn:autoBtn).classList.add('on');restartAutoBar();tickAuto();}
  autoBtn.addEventListener('click',()=>{(autoPlay&&!autoFast)?stopAuto():startAuto(false);});
  fastBtn.addEventListener('click',()=>{(autoPlay&&autoFast)?stopAuto():startAuto(true);});
  function go(n,fromAuto){i=Math.max(0,Math.min(total-1,n));render();if(autoPlay&&!fromAuto){clearTimeout(autoTimer);restartAutoBar();tickAuto();}}
  function next(){go(i+1)}function prev(){go(i-1)}
  document.addEventListener('keydown',e=>{
    switch(e.key){
      case 'ArrowRight':case ' ':case 'PageDown':e.preventDefault();next();break;
      case 'ArrowLeft':case 'PageUp':e.preventDefault();prev();break;
      case 'Home':e.preventDefault();prev();break;case 'End':e.preventDefault();next();break;
      case 'n':case 'N':case 'ш':case 'Ш':notes.classList.toggle('show');break;
      case 'f':case 'F':case 'а':case 'А':document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();break;
      default:if(e.key>='1'&&e.key<='9')go(parseInt(e.key)-1);
    }
  });
  let tx=null;
  document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX});
  document.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){dx<0?next():prev()}tx=null});
  document.getElementById('deck').addEventListener('click',e=>{if(e.target.closest('button'))return;if(e.clientX>window.innerWidth*.5)next();});
  const _h=location.hash.match(/^#slide-(\d+)$/);
  if(_h)i=Math.max(0,Math.min(total-1,parseInt(_h[1])-1));
  window.addEventListener('hashchange',()=>{const _m=location.hash.match(/^#slide-(\d+)$/);if(_m){i=Math.max(0,Math.min(total-1,parseInt(_m[1])-1));render();}});
  render();
</script>
</body>
</html>
