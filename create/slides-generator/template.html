<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- TITLE_PLACEHOLDER --></title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@500;600;700;800&family=Golos+Text:wght@400;500;600;700&family=Lora:ital,wght@1,400;1,500&family=JetBrains+Mono:wght@400;600&display=swap');
  :root{
    --bg:#080a0c;--bg2:#0e1117;--fg:#e8eaf0;--muted:#a7adbe;--dim:#5b6276;
    --green:#4ade80;--green-lo:rgba(74,222,128,.1);--amber:#fbbf24;--blue:#38bdf8;--violet:#c084fc;--orange:#fb923c;--pink:#f472b6;
    --card:#111318;--card2:#181c25;--line:#1e232f;--red:#f87171;
    --font-display:'Unbounded',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-head:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-body:'Golos Text',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --body-size:clamp(1.1rem,1.6cqw,1.42rem);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--fg);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
  .deck{position:fixed;inset:0;container-type:inline-size}
  /* 50/50: текст — левая половина, визуал — правая половина */
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:8vh 52cqw 8vh 8cqw;opacity:0;transition:opacity .32s ease;isolation:isolate;overflow-y:auto}
  .slide.active{display:flex;opacity:1}
  .slide>*{max-width:100%}
  .art{position:absolute;right:0;top:0;width:50%;height:100%;pointer-events:none;z-index:-1;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .art svg{width:88%;height:86%;max-width:580px;max-height:720px}
  .art.mir svg{transform:scaleX(-1)}
  @media (max-aspect-ratio:1/1),(max-width:820px){ .slide{padding:7vh 7cqw} .art{display:none} }

  .kicker{font-family:var(--font-head);font-size:clamp(.72rem,1.05cqw,.9rem);letter-spacing:.2em;text-transform:uppercase;color:var(--green);font-weight:700;margin-bottom:1.5rem}
  h1{font-family:var(--font-display);font-size:clamp(2.1rem,4.7cqw,4.3rem);line-height:1.16;letter-spacing:-.01em;font-weight:700}
  h1 .g{color:var(--fg)}
  h2{font-family:var(--font-display);font-size:clamp(1.55rem,2.8cqw,2.4rem);line-height:1.2;letter-spacing:-.01em;font-weight:700;margin-bottom:2.1rem}
  h2 .g{color:var(--fg)}
  h3{font-family:var(--font-display);font-size:clamp(1.25rem,1.9cqw,1.72rem);line-height:1.16;letter-spacing:-.01em;font-weight:700;margin-bottom:1.05rem}
  h4{font-family:var(--font-display);font-size:clamp(1.02rem,1.5cqw,1.36rem);line-height:1.18;letter-spacing:-.005em;font-weight:600;margin-bottom:.65rem}
  .g,.g2,.g3{color:#fff;-webkit-box-decoration-break:clone;box-decoration-break:clone;border-radius:4px;padding:0 .14em .1em;line-height:inherit}
  .g{background:rgba(74,222,128,.30)}
  .g2{background:rgba(251,191,36,.30)}
  .g3{background:rgba(248,113,113,.32)}
  .lead{font-size:var(--body-size);color:var(--muted);line-height:1.5;max-width:42ch;margin-top:1.5rem}
  .meta{margin-top:2.2rem;color:var(--dim);font-size:clamp(.9rem,1.25cqw,1.08rem);line-height:1.9}
  .meta b{color:var(--fg);font-weight:600}
  .meta .sep{color:var(--dim);padding:0 .4rem}
  ul{list-style:none;display:flex;flex-direction:column;gap:.85rem;max-width:46ch}
  li{position:relative;padding-left:1.5rem;font-size:clamp(1.1rem,1.6cqw,1.42rem);line-height:1.55;color:var(--fg);margin-bottom:.42rem}
  li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--green)}
  li b,li strong{font-weight:680;color:#fff}
  li .sub{display:block;color:var(--fg);font-size:var(--body-size);margin-top:.45rem;line-height:1.55}
  li.dim::before{background:var(--dim)}
  li.warn::before{background:var(--amber)}
  .hosts{display:grid;grid-template-columns:1fr;gap:1.4rem;max-width:none}
  .host-name{font-size:clamp(1.2rem,2cqw,1.7rem);font-weight:700;color:#fff;margin-bottom:.25rem}
  .host-role{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--green);font-weight:600;margin-bottom:.6rem}
  .host-facts{display:flex;flex-direction:column;gap:.25rem}
  .host-fact{font-size:clamp(.82rem,1.3cqw,1rem);color:var(--muted);line-height:1.3}
  .host-fact b{color:var(--fg);font-weight:600}
  .host-signal{margin-top:.7rem;font-size:clamp(.82rem,1.3cqw,1rem);color:var(--fg);font-style:italic;line-height:1.35;border-left:2px solid var(--amber);padding-left:.8rem}
  .route{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;margin-bottom:1.8rem}
  .route-step{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.4rem .8rem;font-size:clamp(.8rem,1.2cqw,1rem);color:var(--fg);font-weight:500}
  .route-step.hi{border-color:var(--green);color:var(--green);background:var(--green-lo)}
  .route-arr{color:var(--dim);font-size:1.05rem}
  .cal{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;max-width:none}
  .cal-day{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;display:flex;gap:.5rem;align-items:baseline}
  .cal-day .cn{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
  .cal-day .cd{font-size:.7rem;color:var(--muted);min-width:3.2em}
  .cal-day .ct{font-size:.74rem;color:var(--fg);line-height:1.2}
  .cal-day.live{border-color:var(--green);background:var(--green-lo)}
  .cal-day.live .cn{color:var(--green)}.cal-day.live .ct{color:#fff;font-weight:600}
  .cal-day.oh{border-color:var(--amber)}.cal-day.oh .cn{color:var(--amber)}
  .cal-day.demo{border-color:var(--amber)}.cal-day.demo .cn{color:var(--amber)}
  .focus-box{background:var(--green-lo);border:1.5px solid var(--green);border-radius:16px;padding:1.8rem 2.1rem;max-width:none;margin-top:.3rem}
  .focus-box .fb-kicker{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--green);font-weight:600;margin-bottom:.7rem}
  .focus-box .fb-body{font-size:clamp(1.25rem,2cqw,1.8rem);font-weight:600;color:#fff;line-height:1.25;letter-spacing:-.01em}
  .focus-box .fb-sub{margin-top:.7rem;color:var(--muted);font-size:clamp(.9rem,1.4cqw,1.15rem);line-height:1.4}
  .demo-list{display:flex;flex-direction:column;gap:.7rem;max-width:none}
  .demo-item{display:flex;align-items:flex-start;gap:.9rem;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:.8rem 1.1rem}
  .demo-item .di-num{font-size:.72rem;font-weight:700;color:var(--amber);min-width:1.5rem;padding-top:.1rem}
  .demo-item .di-body{flex:1}
  .demo-item .di-title{font-family:var(--font-display);font-size:clamp(.95rem,1.4cqw,1.18rem);font-weight:600;color:#fff;margin-bottom:.15rem;letter-spacing:-.005em}
  .demo-item .di-desc{font-size:var(--body-size);color:var(--muted);line-height:1.38}
  .hw-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.3rem 1.6rem;max-width:none;margin-top:.3rem}
  .hw-box .hw-label{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--green);font-weight:600;margin-bottom:.7rem}
  .hw-task{display:flex;align-items:flex-start;gap:.8rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
  .hw-task:last-child{border-bottom:none;padding-bottom:0}
  .hw-task .hk{font-size:.72rem;font-weight:700;color:var(--amber);min-width:1.8rem}
  .hw-task .hv{font-size:clamp(.88rem,1.4cqw,1.1rem);color:var(--fg);line-height:1.3}
  .hw-task .hv span{color:var(--muted);font-size:.85em}
  .qa-big{font-family:var(--font-display);font-size:clamp(3rem,7cqw,6rem);font-weight:800;letter-spacing:-.03em;color:var(--amber);line-height:1;margin-bottom:.4rem}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;max-width:none}
  .cards.g3{grid-template-columns:repeat(2,1fr)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem}
  .card .ct{font-family:var(--font-display);font-weight:600;color:var(--green);font-size:clamp(1.02rem,1.5cqw,1.36rem);margin-bottom:.42rem;letter-spacing:-.005em}
  .card .cd{color:var(--fg);font-size:var(--body-size);line-height:1.42}
  .card .tag{display:inline-block;margin-top:.6rem;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--green);font-weight:600}
  .card .tag.opt{color:var(--dim)}
  .card .ck{color:var(--green);font-weight:800;margin-right:.4rem}
  .arc{display:grid;grid-template-columns:1fr 1fr;gap:2.4rem;max-width:none}
  .arc-col{background:none;border:none;border-radius:0;padding:0}
  .arc-week{font-family:var(--font-display);font-size:clamp(1.1rem,1.7cqw,1.4rem);letter-spacing:-.01em;text-transform:none;color:#fff;font-weight:700;margin-bottom:.9rem}
  .arc-col.w1 .arc-week{color:var(--green)}.arc-col.w2 .arc-week{color:var(--amber)}
  .arc-theme{font-family:var(--font-head);font-size:clamp(1.05rem,1.7cqw,1.4rem);font-weight:700;color:#fff;margin-bottom:.7rem;line-height:1.15}
  .arc-col ul{gap:.7rem;max-width:none}
  .arc-col li{font-size:var(--body-size)}
  .arc-col.w1 li::before{background:var(--green)}.arc-col.w2 li::before{background:var(--amber)}
  .src{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;max-width:none}
  .src-item{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:.75rem .95rem}
  .src-item .si-t{font-weight:650;color:#fff;font-size:clamp(.82rem,1.3cqw,1.02rem);margin-bottom:.2rem}
  .src-item .si-d{color:var(--muted);font-size:clamp(.82rem,1.15cqw,.95rem);line-height:1.35}
  .sec-num{font-size:clamp(.7rem,1cqw,.85rem);letter-spacing:.22em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:1.1rem;display:flex;align-items:center;gap:.6rem}
  .sec-num::before{content:"";width:24px;height:2px;background:var(--amber);border-radius:2px}
  .sec-title{font-family:var(--font-display);font-size:clamp(2.1rem,5.2cqw,4rem);font-weight:700;color:#fff;letter-spacing:-.015em;line-height:1.16}
  .sec-title .g2{color:var(--fg)}
  .sec-sub{margin-top:1.5rem;font-size:clamp(1rem,1.6cqw,1.35rem);color:var(--muted);max-width:30ch;line-height:1.5}
  #auto-bar{position:fixed;left:0;top:0;height:2px;width:0;background:rgba(251,191,36,.55);z-index:31;pointer-events:none;transition:none}
  #auto-bar.running{animation:auto-count 20s linear forwards}
  #auto-bar.running.fast{animation:auto-count 7s linear forwards}
  @keyframes auto-count{from{width:100%}to{width:0}}
  @keyframes hr-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes hr-pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(4);opacity:.08}}
  @keyframes hr-color{0%,100%{fill:#4ade80}25%{fill:#fbbf24}50%{fill:#38bdf8}75%{fill:#c084fc}}
  .menu-btn{position:fixed;top:1.5vh;right:1.6vw;display:grid;place-items:center;width:2.1rem;height:2.1rem;padding:0;background:transparent;border:none;border-radius:50%;color:var(--fg);opacity:.28;cursor:pointer;z-index:36;transition:opacity .2s,background .2s,color .2s}
  .menu-btn svg{width:1.1rem;height:1.1rem;display:block}
  .menu-btn:hover,.menu-btn[aria-expanded="true"]{opacity:.95;background:rgba(255,255,255,.07)}
  .menu-btn:focus-visible{outline:1px solid rgba(255,255,255,.35);outline-offset:2px;opacity:.95}
  .menu-btn.live{opacity:.9;color:var(--amber)}
  .menu-btn.live.fast{color:var(--green)}
  .menu-panel{position:fixed;top:calc(1.5vh + 2.5rem);right:1.6vw;background:rgba(16,18,23,.94);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:.35rem;z-index:36;display:flex;flex-direction:column;gap:.1rem;min-width:236px;box-shadow:0 14px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;transform:translateY(-4px) scale(.98);transform-origin:top right;transition:opacity .16s,transform .16s;backdrop-filter:blur(12px)}
  .menu-panel.open{opacity:1;pointer-events:auto;transform:none}
  .menu-item{display:flex;align-items:center;gap:.7rem;background:transparent;border:none;color:var(--fg);padding:.55rem .65rem;border-radius:8px;font-family:var(--font-head);font-size:.8rem;font-weight:500;cursor:pointer;text-align:left;letter-spacing:.01em;transition:background .15s}
  .menu-item svg{width:1rem;height:1rem;flex:none;opacity:.6;transition:opacity .15s}
  .menu-item:hover{background:rgba(255,255,255,.06)}
  .menu-item:hover svg,.menu-item.on svg{opacity:1}
  .menu-item.on{color:var(--amber)}
  .menu-sep{height:1px;background:rgba(255,255,255,.06);margin:.25rem .4rem}
  .menu-status{display:none;color:var(--muted);font-size:.7rem;line-height:1.45;padding:.35rem .65rem;max-width:236px}
  .menu-status.show{display:block}
  .menu-status.err{color:#f87171}
  .menu-item kbd{margin-left:auto;font-family:var(--font-body);font-size:.66rem;color:var(--dim);letter-spacing:.02em}
  .menu-hint{color:var(--dim);font-size:.66rem;line-height:1.55;padding:.55rem .65rem .35rem;margin-top:.2rem;border-top:1px solid rgba(255,255,255,.06);letter-spacing:.02em}
  #fast-btn.on{color:var(--green)}
  .counter-wrap{position:fixed;right:2.2cqw;bottom:1.8vh;display:flex;align-items:center;gap:.65rem;z-index:30}
  .counter{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;letter-spacing:.05em}
  .counter-bar{width:64px;height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
  .counter-fill{height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,var(--green),var(--amber));transition:width .32s;box-shadow:0 0 8px rgba(74,222,128,.35)}
  .brand{position:fixed;left:2.2vw;bottom:1.8vh;color:var(--muted);font-size:.72rem;z-index:30;letter-spacing:.12em;text-transform:uppercase}
  .notes{position:fixed;left:0;right:0;bottom:0;max-height:40vh;overflow:auto;background:rgba(6,7,10,.97);border-top:1px solid var(--line);padding:1.4rem 9vw 1.8rem;z-index:40;transform:translateY(100%);transition:transform .28s ease}
  .notes.show{transform:translateY(0)}
  .notes h4{color:var(--green);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;margin-bottom:.6rem}
  .notes p{color:#c8cdd8;font-size:.95rem;line-height:1.55;max-width:80ch}

  /* === Режимы окна: ?view=embed (превью в iframe) · ?view=presenter (экран ведущего) === */
  html.sg-embed .menu-btn,html.sg-embed .menu-panel,html.sg-embed .notes,html.sg-embed #auto-bar{display:none!important}
  html.sg-presenter body>:not(#pv):not(script){display:none!important}
  #pv{position:fixed;inset:0;display:grid;grid-template-columns:1.55fr 1fr;grid-template-rows:auto 1fr;gap:16px 20px;padding:16px 20px 20px;background:#05060a;font-family:var(--font-body);color:var(--fg)}
  #pv .pv-top{grid-column:1/-1;display:flex;align-items:center;gap:22px;font-variant-numeric:tabular-nums}
  #pv .pv-timer{font-family:var(--font-display);font-size:2.4rem;color:var(--green);cursor:pointer;line-height:1}
  #pv .pv-timer.paused{color:var(--amber)}
  #pv .pv-clock,#pv .pv-num{color:var(--muted);font-size:1.1rem}
  #pv .pv-num{margin-left:auto;color:var(--fg)}
  #pv button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:.35rem .7rem;font:inherit;font-size:.8rem;cursor:pointer}
  #pv button:hover{color:var(--fg)}
  #pv .pv-col{display:flex;flex-direction:column;gap:12px;min-height:0}
  #pv .pv-lbl{color:var(--dim);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase}
  #pv .pv-frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:10px;border:1px solid var(--line);background:var(--bg);flex:none}
  #pv .pv-frame iframe{position:absolute;top:0;left:0;width:1280px;height:720px;border:0;transform-origin:0 0;pointer-events:none}
  #pv .pv-end{position:absolute;inset:0;display:none;place-items:center;color:var(--muted);background:var(--bg)}
  #pv .pv-frame.end .pv-end{display:grid}
  #pv .pv-notes{flex:1;overflow:auto;font-size:1.35rem;line-height:1.55;color:#d6dae4;white-space:pre-wrap}
  #pv .pv-notes.empty{color:var(--dim);font-size:1rem}
  /* === Комментарии к слайдам (⋯ → Комментарий, Ctrl+K) === */
  html.sg-cm .deck{cursor:crosshair}
  .cm-bar{position:fixed;top:1.5vh;left:50%;transform:translateX(-50%);z-index:45;background:var(--amber);color:#1a1000;font-size:.78rem;font-weight:600;padding:.4rem .9rem;border-radius:99px;display:none}
  html.sg-cm .cm-bar{display:block}
  .cm-pin{position:fixed;z-index:44;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--amber);color:#1a1000;font-size:.72rem;font-weight:700;display:none;place-items:center;cursor:pointer;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
  html.sg-cm .cm-pin{display:grid}
  .cm-pin:hover{background:#f87171}
  .cm-box{position:fixed;z-index:46;width:300px;background:rgba(16,18,23,.97);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:.5rem;box-shadow:0 14px 40px rgba(0,0,0,.5)}
  .cm-box textarea{width:100%;height:84px;resize:vertical;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;font-size:.85rem;line-height:1.45}
  .cm-box div{color:var(--dim);font-size:.66rem;padding:.2rem .1rem 0}

  /* === Полноширинные раскладки (без бокового арта) === */
  .slide.wide{padding:7vh 7cqw 6vh 7cqw;justify-content:safe center}
  .slide.wide>*{max-width:none}
  .slide.wide>.hexring{flex:1;height:auto;min-height:50vh}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:2.2rem 2.6rem;margin-top:.6rem;max-width:none}
  .pcard{background:none;border:none;padding:0}
  .ic{display:block;flex:none}
  .pcard .ic{width:clamp(85px,7.4cqw,113px);height:clamp(85px,7.4cqw,113px);margin-bottom:1.2rem}
  .pcard .pt{font-family:var(--font-head);font-size:clamp(1.08rem,1.7cqw,1.42rem);font-weight:700;color:#fff;margin-bottom:.5rem;line-height:1.14}
  .pcard .pd{color:var(--muted);font-size:var(--body-size);line-height:1.42}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:1.8rem;max-width:none}
  .cols2 .grp-label{font-family:var(--font-head);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:.7rem}
  .cards.g3w{grid-template-columns:repeat(3,1fr)}
  /* Однорядные сетки во всю ширину (вместо 2×2) */
  .cards.g4{grid-template-columns:repeat(4,1fr);gap:2.4rem 3rem}
  .cards.g5{grid-template-columns:repeat(5,1fr);gap:1.4rem 2rem}
  .pgrid.row4{grid-template-columns:repeat(4,1fr)}
  .demo-list.two{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
  /* колонка-карточка с номером для однорядных сеток */
  .colcard{background:none;border:none;padding:0;display:flex;flex-direction:column;gap:.4rem}
  .colcard .ic{width:clamp(76px,6.5cqw,99px);height:clamp(76px,6.5cqw,99px);margin-bottom:.6rem}
  .colcard .ch{font-family:var(--font-display);font-weight:600;color:#fff;font-size:clamp(1rem,1.45cqw,1.3rem);line-height:1.16;letter-spacing:-.005em}
  .colcard .cb{color:var(--muted);font-size:var(--body-size);line-height:1.42}
  /* безрамочные карточки — по умолчанию предпочитаем их + воздух, а не залитые блоки с border */
  /* 4-colour cycling: .nn AND .nh always same color per column */
  .cards .card:nth-child(4n+1) .ct,.pgrid .numcard:nth-child(4n+1) .nn,.pgrid .numcard:nth-child(4n+1) .nh,.numgrid .numcard:nth-child(4n+1) .nn,.numgrid .numcard:nth-child(4n+1) .nh,.cards.g5 .numcard:nth-child(5n+1) .nn,.cards.g5 .numcard:nth-child(5n+1) .nh{color:var(--green)}
  .cards .card:nth-child(4n+2) .ct,.pgrid .numcard:nth-child(4n+2) .nn,.pgrid .numcard:nth-child(4n+2) .nh,.numgrid .numcard:nth-child(4n+2) .nn,.numgrid .numcard:nth-child(4n+2) .nh,.cards.g5 .numcard:nth-child(5n+2) .nn,.cards.g5 .numcard:nth-child(5n+2) .nh{color:var(--amber)}
  .cards .card:nth-child(4n+3) .ct,.pgrid .numcard:nth-child(4n+3) .nn,.pgrid .numcard:nth-child(4n+3) .nh,.numgrid .numcard:nth-child(4n+3) .nn,.numgrid .numcard:nth-child(4n+3) .nh,.cards.g5 .numcard:nth-child(5n+3) .nn,.cards.g5 .numcard:nth-child(5n+3) .nh{color:var(--blue)}
  .cards .card:nth-child(4n+4) .ct,.pgrid .numcard:nth-child(4n+4) .nn,.pgrid .numcard:nth-child(4n+4) .nh,.numgrid .numcard:nth-child(4n+4) .nn,.numgrid .numcard:nth-child(4n+4) .nh,.cards.g5 .numcard:nth-child(5n+4) .nn,.cards.g5 .numcard:nth-child(5n+4) .nh{color:var(--violet)}
  .cards.g5 .numcard:nth-child(5n+5) .nn,.cards.g5 .numcard:nth-child(5n+5) .nh{color:var(--green)}
  .cards.bare{gap:2.4rem 3rem}
  .cards.bare .card{background:none;border:none;padding:0}
  .numgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4rem 3rem;max-width:none;margin-top:.6rem}
  .hexring{position:relative;height:62vh;width:100%;margin-top:.6rem}
  .hexring .hr-ring{position:absolute;left:13%;top:6%;width:74%;height:88%;border:1px solid rgba(255,255,255,.18);border-radius:50%;pointer-events:none;box-shadow:inset 0 0 60px rgba(74,222,128,.03)}
  .hexring .hr-item{position:absolute;width:24%;text-align:center}
  .hexring .hr-n{font-family:var(--font-display);font-size:clamp(1.5rem,2.3cqw,2.1rem);font-weight:700;line-height:1;margin-bottom:.22rem}
  .hexring .hr-t{font-family:var(--font-display);font-size:clamp(.8rem,1.15cqw,.98rem);font-weight:600;color:#fff;letter-spacing:-.005em;line-height:1.15;margin-bottom:.25rem}
  .hexring .hr-d{font-size:clamp(.73rem,1cqw,.88rem);color:rgba(255,255,255,.6);line-height:1.4}
  .numcard .nn{font-family:var(--font-display);font-size:clamp(1.9rem,2.8cqw,2.7rem);font-weight:700;color:var(--green);line-height:1;margin-bottom:.55rem}
  .numcard .nh{font-family:var(--font-display);font-weight:600;font-size:clamp(1.02rem,1.5cqw,1.32rem);margin-bottom:.5rem;line-height:1.16;letter-spacing:-.005em}
  .bq{font-family:'Lora',Georgia,serif;font-style:italic;font-size:var(--body-size);line-height:1.65;border-left:3px solid currentColor;padding-left:1.2rem;color:var(--fg);margin:.7rem 0 .6rem}
  .numcard .nb{color:var(--fg);font-size:var(--body-size);line-height:1.42}
  /* стрелочные подпункты под буллетом */
  .subs{list-style:none;margin:.55rem 0 0;padding:0;display:flex;flex-direction:column;gap:.4rem;max-width:none}
  .subs li{position:relative;padding-left:1.4rem;font-size:clamp(.87rem,1.2cqw,1.04rem);line-height:1.35;color:var(--muted)}
  .subs li::before{content:"\2192";position:absolute;left:0;top:0;width:auto;height:auto;background:none;border-radius:0;color:var(--green);font-weight:700}
  .subs li b{color:#fff;font-weight:600}
  /* горизонтальная последовательность с → между шагами */
  .seq{display:flex;align-items:flex-start;gap:.4rem;margin-top:.9rem;max-width:none}
  .seq-card{flex:1;min-width:0}
  .seq-arr{flex:none;color:var(--dim);font-size:1.05rem;padding-top:1.7rem;opacity:.65;line-height:1}
  .seq-card .sn{font-family:var(--font-display);font-size:clamp(1.5rem,2.3cqw,2.2rem);color:var(--green);/* overridden by nth */;line-height:1;margin-bottom:.35rem;font-weight:700}
  .seq-card .st{font-family:var(--font-display);font-weight:600;color:#fff;font-size:clamp(.95rem,1.45cqw,1.22rem);margin-bottom:.3rem;line-height:1.15;letter-spacing:-.005em}
  .seq-card .sd{color:var(--fg);font-size:clamp(.9rem,1.35cqw,1.12rem);line-height:1.42}
  .seq .seq-card:nth-child(2n+1) .sn{color:var(--green)}
  .seq .seq-card:nth-child(4n+3) .sn{color:var(--blue)}
  .seq .seq-card:nth-child(6n+5) .sn{color:var(--amber)}
  /* 6 cards: 01 green 02 blue 03 amber 04 violet 05 green 06 blue */
  .seq .seq-card:nth-child(1) .sn{color:var(--green)}
  .seq .seq-card:nth-child(2) .sn{color:var(--blue)}
  .seq .seq-card:nth-child(3) .sn{color:var(--amber)}
  .seq .seq-card:nth-child(4) .sn{color:var(--violet)}
  .seq .seq-card:nth-child(5) .sn{color:var(--green)}
  .seq .seq-card:nth-child(6) .sn{color:var(--blue)}
  /* top-left persistent deck/session tag, mirrors .brand on the opposite corner */
  .corner-tag{position:fixed;left:2.2vw;top:1.8vh;color:var(--muted);font-size:.72rem;z-index:30;letter-spacing:.12em;text-transform:uppercase}
  /* top-right controls, tucked behind a "..." menu button */
  /* image embed in art area */
  .art.img{padding:0;overflow:hidden;align-items:stretch}
  .art.img img{width:100%;height:100%;object-fit:cover;display:block}
  /* Иллюстрации из исходных слайдов: целиком, без обрезки */
  /* Слайд «План сессии»: лестница уровней (нативно, вместо картинки) */
  .art.levels{padding:0 4cqw 0 1cqw}
  .lv-wrap{position:relative;width:min(100%,520px);display:flex;flex-direction:column;align-items:center;gap:clamp(.7rem,1.8vh,1.2rem);padding-top:clamp(4.5rem,11vh,7rem)}
  .lv{font-family:var(--font-head);font-weight:800;font-size:clamp(1.05rem,1.75cqw,1.5rem);letter-spacing:-.01em;color:#2b2416;text-align:center;padding:clamp(1.1rem,3.4vh,1.9rem) 0;border-radius:12px;border:3px solid}
  .lv1{width:46%;background:#6dd77c;border-color:#47b85a;box-shadow:0 0 0 0 rgba(74,222,128,.5);animation:lvpulse 2.6s ease-out infinite}
  .lv2{width:74%;background:#ffca4d;border-color:#f0a81a}
  .lv3{width:100%;background:#ffe0c8;border-color:#fb923c}
  .lv-hint{position:absolute;top:0;right:0;width:46%;display:flex;flex-direction:column;align-items:flex-end;color:var(--fg)}
  .lv-hint span{font-family:var(--font-display);font-weight:700;font-size:clamp(.8rem,1.25cqw,1.05rem);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
  .lv-hint svg{width:clamp(56px,6.5cqw,90px);margin-right:4%;margin-top:.3rem}
  @keyframes lvpulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.45)}70%,100%{box-shadow:0 0 0 18px rgba(74,222,128,0)}}
  @media (prefers-reduced-motion:reduce){.lv1{animation:none}}
  .art.pic{padding:7vh 4cqw 7vh 1cqw}
  .art.pic img{max-width:100%;max-height:80vh;width:auto;height:auto;object-fit:contain;border-radius:14px;display:block}
  .wide-pic{display:block;width:100%;max-height:50vh;object-fit:contain;border-radius:14px;margin:0 auto}
  .wide-cap{margin-top:1.6rem;color:var(--muted);font-size:var(--body-size);line-height:1.5;text-align:center}
  /* Ритм: заголовок → лид → контент */
  h2+.lead{margin-top:-1rem}
  .slide.wide>.lead{max-width:70ch;margin-bottom:2.2rem}
  .slide.wide>.lead+.cards,.slide.wide>.lead+.stack{margin-top:0}
  /* Таблицы и «задача → инструмент»: крупно, читается с экрана */
  .tbl{width:100%;border-collapse:collapse;font-size:clamp(1.05rem,1.6cqw,1.4rem)}
  .tbl th,.tbl td{text-align:left;padding:.75rem 1rem;border-bottom:1px solid rgba(255,255,255,.07)}
  .tbl tr:last-child td{border-bottom:none}
  .stack{display:grid;grid-template-columns:repeat(2,auto 1fr);gap:1.1rem 1.4rem;align-items:center}
  .stack .sk{font-family:var(--font-head);font-weight:600;font-size:clamp(1rem,1.5cqw,1.3rem);color:var(--fg)}
  .stack .sv{justify-self:start;font-size:clamp(1rem,1.45cqw,1.25rem);font-weight:600;color:#0a0b0e;padding:.4rem .95rem;border-radius:8px;line-height:1.25}
  /* === +12 раскладок (2026-10-02) === */
  /* bignum: одна большая цифра + подпись (50/50) */
  .bigstat{display:flex;flex-direction:column;gap:.6rem;margin-top:.4rem}
  .bs-n{font-family:var(--font-display);font-weight:800;font-size:clamp(4.5rem,11cqw,10rem);line-height:.95;letter-spacing:-.04em;color:var(--green)}
  .bs-n small{font-size:.42em;letter-spacing:-.01em;margin-left:.08em}
  .bs-l{font-family:var(--font-head);font-weight:700;font-size:clamp(1.25rem,2cqw,1.8rem);color:#fff;line-height:1.25;max-width:22ch}
  .bs-src{color:var(--muted);font-size:clamp(.9rem,1.2cqw,1.05rem);margin-top:.6rem}
  /* statement: крупное утверждение по центру во всю ширину */
  .slide.statement{align-items:center;text-align:center}
  .st-text{font-family:var(--font-display);font-weight:700;font-size:clamp(2.2rem,5.2cqw,4.6rem);line-height:1.18;letter-spacing:-.015em;max-width:22ch;margin:0 auto}
  .st-by{margin-top:2.2rem;font-family:var(--font-head);font-size:clamp(.8rem,1.1cqw,.95rem);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
  /* vs: было → стало, две колонки со стрелкой */
  .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:3rem;align-items:center;max-width:none}
  .vs-h{font-family:var(--font-display);font-weight:700;font-size:clamp(1.15rem,1.8cqw,1.5rem);margin-bottom:1.2rem}
  .vs-col.before .vs-h{color:var(--red)}.vs-col.after .vs-h{color:var(--green)}
  .vs-col ul{max-width:none}
  .vs-col.before li{color:var(--muted)}.vs-col.before li::before{background:var(--red)}
  .vs-arr{width:clamp(56px,5.5cqw,84px);height:clamp(56px,5.5cqw,84px);border-radius:50%;display:grid;place-items:center;background:var(--green-lo);color:var(--green);font-size:clamp(1.5rem,2.4cqw,2.2rem);font-weight:700}
  /* timeline: горизонтальная ось с вехами */
  .tline{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2rem;margin-top:1.2rem;padding-top:2.6rem;max-width:none}
  .tline::before{content:"";position:absolute;left:0;right:0;top:.55rem;height:2px;background:linear-gradient(90deg,var(--green),var(--blue),var(--violet))}
  .tl-item{position:relative}
  .tl-item::before{content:"";position:absolute;left:0;top:-2.6rem;width:1.1rem;height:1.1rem;border-radius:50%;background:var(--bg);border:3px solid var(--c,var(--green))}
  .tl-item.now::before{background:var(--c,var(--green));box-shadow:0 0 0 7px rgba(74,222,128,.18)}
  .tl-when{font-family:var(--font-display);font-weight:700;font-size:clamp(1.3rem,2cqw,1.8rem);color:var(--c,var(--green));margin-bottom:.45rem}
  .tl-t{font-family:var(--font-display);font-weight:600;color:#fff;font-size:clamp(1rem,1.45cqw,1.28rem);margin-bottom:.4rem;line-height:1.16}
  .tl-d{color:var(--muted);font-size:var(--body-size);line-height:1.42}
  /* hbars: горизонтальные бары-сравнение, растут при показе */
  .hbars{display:grid;grid-template-columns:auto 1fr auto;gap:1.3rem 1.1rem;align-items:center;max-width:none;margin-top:.4rem}
  .hb-row{display:contents}
  .hb-l{font-family:var(--font-head);font-weight:700;color:#fff;font-size:clamp(1rem,1.5cqw,1.3rem)}
  .hb-track{height:clamp(14px,1.6cqw,22px);border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
  .hb-fill{height:100%;width:var(--w);border-radius:99px;background:var(--c,var(--green))}
  .slide.active .hb-fill{animation:hbgrow 1.1s cubic-bezier(.2,0,0,1) both}
  @keyframes hbgrow{from{width:0}}
  .hb-v{font-family:var(--font-display);font-weight:700;color:var(--c,var(--green));font-size:clamp(1.05rem,1.6cqw,1.4rem);min-width:3.5ch;text-align:right}
  /* funnel: воронка из сужающихся полос */
  .funnel{display:flex;flex-direction:column;align-items:center;gap:.55rem;max-width:none;margin-top:.4rem}
  .fn-l{display:flex;justify-content:space-between;align-items:center;gap:1rem;width:var(--w);padding:.85rem 1.3rem;border-radius:12px;background:color-mix(in srgb,var(--c) 22%,transparent);border-left:4px solid var(--c)}
  .fn-t{font-family:var(--font-head);font-weight:700;color:#fff;font-size:clamp(.95rem,1.4cqw,1.22rem)}
  .fn-v{font-family:var(--font-display);font-weight:700;color:var(--c);font-size:clamp(1.05rem,1.6cqw,1.4rem)}
  /* venn: три пересекающихся круга */
  .venn{position:relative;width:min(100%,76vh);aspect-ratio:1.15;margin:.2rem auto 0}
  .vn{position:absolute;width:56%;aspect-ratio:1;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,transparent);border:2px solid color-mix(in srgb,var(--c) 70%,transparent);display:flex;padding:9%;font-family:var(--font-display);font-weight:600;color:var(--c);font-size:clamp(.95rem,1.45cqw,1.25rem);line-height:1.15}
  .vn.a{left:4%;top:0;align-items:flex-start;justify-content:flex-start;padding-top:22%}
  .vn.b{right:4%;top:0;align-items:flex-start;justify-content:flex-end;text-align:right;padding-top:22%}
  .vn.c{left:22%;bottom:0;align-items:flex-end;justify-content:center;text-align:center}
  .vn-c{position:absolute;left:50%;top:50%;transform:translate(-50%,-30%);font-family:var(--font-display);font-weight:800;color:#fff;font-size:clamp(.95rem,1.4cqw,1.2rem);text-align:center;background:var(--bg);padding:.35rem .7rem;border-radius:8px}
  /* agenda: план с таймингом, текущий пункт подсвечен */
  .agenda{display:flex;flex-direction:column;max-width:none;margin-top:.2rem}
  .ag-row{display:grid;grid-template-columns:3.2ch 1fr auto;gap:1.1rem;align-items:baseline;padding:.85rem 0;border-bottom:1px solid rgba(255,255,255,.07)}
  .ag-row:last-child{border-bottom:none}
  .ag-n{font-family:var(--font-display);font-weight:700;color:var(--dim);font-size:clamp(.95rem,1.35cqw,1.15rem)}
  .ag-t{font-size:var(--body-size);color:var(--fg);line-height:1.35}
  .ag-m{color:var(--muted);font-size:clamp(.88rem,1.2cqw,1.02rem);font-variant-numeric:tabular-nums}
  .ag-row.now .ag-n,.ag-row.now .ag-m{color:var(--green)}.ag-row.now .ag-t{color:#fff;font-weight:650}
  .ag-row.done .ag-t{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.2)}
  /* testimonial: отзыв с большой кавычкой */
  .testi{position:relative;max-width:none;padding-top:clamp(3rem,6cqw,5rem)}
  .testi::before{content:"\201C";position:absolute;left:-.05em;top:-.12em;font-family:'Lora',Georgia,serif;font-size:clamp(7rem,13cqw,11rem);line-height:1;color:var(--amber);opacity:.85}
  .ts-text{font-family:'Lora',Georgia,serif;font-style:italic;font-size:clamp(1.35rem,2.3cqw,2.05rem);line-height:1.45;color:#fff;max-width:30ch}
  .ts-who{display:flex;align-items:center;gap:1rem;margin-top:2rem}
  .ts-av{width:clamp(48px,4.4cqw,64px);height:clamp(48px,4.4cqw,64px);border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--amber);font-family:var(--font-display);font-weight:700;font-size:1.05rem;flex:none;object-fit:cover}
  .ts-name{font-family:var(--font-head);font-weight:700;color:#fff;font-size:clamp(1rem,1.4cqw,1.2rem)}
  .ts-role{color:var(--muted);font-size:clamp(.88rem,1.2cqw,1.02rem)}
  /* prompt: окно промпта, моноширинный текст, переменные подсвечены */
  .prompt{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:none;margin-top:.2rem}
  .pr-bar{display:flex;align-items:center;gap:.45rem;padding:.7rem 1rem;border-bottom:1px solid var(--line)}
  .pr-bar i{width:.7rem;height:.7rem;border-radius:50%;background:var(--dim);opacity:.6}
  .pr-bar span{margin-left:.6rem;font-family:var(--font-head);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .pr-body{padding:1.2rem 1.4rem 1.4rem;font-family:var(--font-mono);font-size:clamp(.95rem,1.35cqw,1.18rem);line-height:1.65;color:var(--fg);white-space:pre-wrap}
  .pr-body .pv{color:var(--amber);background:rgba(251,191,36,.12);border-radius:4px;padding:0 .2em}
  .pr-body .pc{color:var(--dim)}
  .pr-body::after{content:"";display:inline-block;width:.55em;height:1.1em;vertical-align:text-bottom;background:var(--green);margin-left:.15em;animation:caret 1.1s steps(1) infinite}
  @keyframes caret{50%{opacity:0}}
  /* chat: диалог пузырями */
  .chat{display:flex;flex-direction:column;gap:.9rem;max-width:none;margin-top:.2rem}
  .msg{max-width:84%;padding:.85rem 1.15rem;border-radius:18px;font-size:var(--body-size);line-height:1.45}
  .msg .who{display:block;font-family:var(--font-head);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:.3rem;opacity:.75}
  .msg.me{align-self:flex-end;background:var(--card2);color:var(--fg);border-bottom-right-radius:6px}
  .msg.ai{align-self:flex-start;background:rgba(56,189,248,.12);color:#fff;border-bottom-left-radius:6px}
  .msg.ai .who{color:var(--blue)}
  .slide.active .msg{animation:msgin .5s ease both}
  .slide.active .msg:nth-child(2){animation-delay:.35s}.slide.active .msg:nth-child(3){animation-delay:.7s}.slide.active .msg:nth-child(4){animation-delay:1.05s}
  @keyframes msgin{from{opacity:0;transform:translateY(10px)}}
  /* bleed: фото на весь слайд + крупный текст поверх */
  .slide.bleed{justify-content:flex-end;padding:8vh 8cqw 11vh}
  .bleed-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
  .slide.bleed::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,10,12,.15) 0%,rgba(8,10,12,.55) 55%,rgba(8,10,12,.94) 100%)}
  .slide.bleed h1,.slide.bleed h2{max-width:20ch}
  /* === +7 раскладок по референсам PowerPoint/Keynote (2026-10-02) === */
  /* flip: визуал слева, текст справа */
  .slide.flip{padding:8vh 8cqw 8vh 52cqw}
  .slide.flip>.art{right:auto;left:0}
  /* side-tag: вертикальная метка раздела у левого края (модификатор любого слайда) */
  .side-tag{position:absolute;left:2.4cqw;top:50%;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;font-family:var(--font-head);font-size:clamp(.7rem,.95cqw,.85rem);letter-spacing:.32em;text-transform:uppercase;color:var(--dim);font-weight:700;max-width:none}
  /* logos: стена логотипов 6 (3×2) или 12 (6×2); img или текст-вордмарк */
  .logos{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.07);border-radius:14px;overflow:hidden;max-width:none;margin-top:.4rem}
  .logos.l12{grid-template-columns:repeat(6,1fr)}
  .lg{background:var(--bg);display:flex;align-items:center;justify-content:center;gap:.6rem;min-height:clamp(90px,15vh,150px);padding:1rem;font-family:var(--font-display);font-weight:700;font-size:clamp(1rem,1.6cqw,1.4rem);color:var(--fg);letter-spacing:-.01em}
  .logos.l12 .lg{min-height:clamp(70px,11vh,110px);font-size:clamp(.85rem,1.25cqw,1.1rem)}
  .lg img{max-width:70%;max-height:56px;object-fit:contain;filter:grayscale(1) brightness(1.6);opacity:.85}
  .lg i{width:.75em;height:.75em;border-radius:3px;background:var(--c,var(--blue));flex:none}
  /* pricing: тарифы, рекомендуемый — .plan.hi */
  .plans{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6rem;align-items:stretch;max-width:none;margin-top:.4rem}
  .plan{border:1px solid var(--line);border-radius:18px;padding:1.6rem 1.7rem;display:flex;flex-direction:column}
  .plan.hi{border:1.5px solid var(--green);background:var(--green-lo)}
  .pl-badge{align-self:flex-start;font-family:var(--font-head);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#0a0b0e;background:var(--green);border-radius:99px;padding:.25rem .7rem;margin-bottom:.9rem}
  .pl-n{font-family:var(--font-display);font-weight:700;color:#fff;font-size:clamp(1.1rem,1.6cqw,1.4rem);margin-bottom:.5rem}
  .pl-p{font-family:var(--font-display);font-weight:800;font-size:clamp(1.9rem,3.2cqw,2.9rem);color:var(--fg);letter-spacing:-.02em;line-height:1.05}
  .pl-p small{font-size:.38em;color:var(--muted);font-weight:600;letter-spacing:0;margin-left:.3em}
  .plan.hi .pl-p{color:var(--green)}
  .plan ul{margin-top:1.2rem;gap:.55rem;max-width:none}
  .plan li{font-size:clamp(.95rem,1.35cqw,1.15rem);margin-bottom:0}
  /* case: задача → решение → результат */
  .case{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:3rem;max-width:none;margin-top:.4rem}
  .cs-k{font-family:var(--font-display);font-weight:700;font-size:clamp(1.05rem,1.6cqw,1.35rem);color:var(--c);margin-bottom:.8rem}
  .cs-t{color:var(--fg);font-size:var(--body-size);line-height:1.5}
  .cs-n{font-family:var(--font-display);font-weight:800;font-size:clamp(2.6rem,5cqw,4.4rem);line-height:1;letter-spacing:-.03em;color:var(--green);margin-bottom:.4rem}
  .cs-n+.cs-t{color:var(--muted)}
  .cs-who{margin-top:2.4rem;color:var(--muted);font-size:clamp(.9rem,1.2cqw,1.05rem)}
  .cs-who b{color:#fff;font-weight:650}
  /* contact: финальный слайд с контактами и QR */
  .contacts{display:grid;grid-template-columns:auto 1fr;gap:1rem 2rem;align-items:baseline;max-width:none;margin-top:.6rem}
  .ct-k{font-family:var(--font-head);font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .ct-v{font-size:clamp(1.15rem,1.8cqw,1.55rem);color:#fff;font-weight:600}

  .art.qr img{width:min(62%,320px);aspect-ratio:1;border-radius:18px;background:#fff;padding:14px;image-rendering:pixelated}
  .art.qr span{color:var(--muted);font-size:clamp(.9rem,1.2cqw,1.05rem)}
  /* gallery: 2–3 фото в ряд (.g3) или мозаика 1 большое + 2 (.mosaic) */
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;height:56vh;max-width:none;margin-top:.4rem}
  .gallery.g2{grid-template-columns:repeat(2,1fr)}
  .gallery.mosaic{grid-template-columns:1.6fr 1fr;grid-template-rows:1fr 1fr}
  .gallery.mosaic figure:first-child{grid-row:span 2}
  .gallery figure{position:relative;border-radius:14px;overflow:hidden;min-height:0}
  .gallery img{width:100%;height:100%;object-fit:cover;display:block}
  .gallery figcaption{position:absolute;left:0;right:0;bottom:0;padding:1.6rem 1rem .8rem;background:linear-gradient(transparent,rgba(8,10,12,.85));color:#fff;font-family:var(--font-head);font-weight:700;font-size:clamp(.9rem,1.25cqw,1.08rem)}
  /* faq: вопросы и ответы в две колонки */
  .faq{display:grid;grid-template-columns:1fr 1fr;gap:2rem 3.4rem;max-width:none;margin-top:.4rem}
  .fq-q{font-family:var(--font-display);font-weight:600;color:#fff;font-size:clamp(1.02rem,1.5cqw,1.3rem);line-height:1.2;margin-bottom:.5rem;padding-left:1.6rem;position:relative}
  .fq-q::before{content:"?";position:absolute;left:0;top:0;color:var(--amber);font-weight:800}
  .fq-a{color:var(--muted);font-size:var(--body-size);line-height:1.45;padding-left:1.6rem}
  /* 9:16 vertical mode */
  .deck.ratio-9-16{position:relative;width:min(100vw,56.25vh);height:min(177.7vw,100vh);aspect-ratio:9/16;margin:0 auto}
  .deck.ratio-9-16 .slide{padding:9vh 8cqw}
  .deck.ratio-9-16 .art{display:none}
  @media(max-width:600px){body{font-size:14px}}
  /* colored section dividers by block */
  .sec-divider-1 .sec-title{color:var(--green)}
  .sec-divider-2 .sec-title{color:var(--amber)}
  .sec-divider-3 .sec-title{color:var(--blue)}
  .sec-divider-4 .sec-title{color:var(--violet)}
  /* print styles */
  @media print{
    @page{size:13.333in 7.5in;margin:0}
    body{background:#fff;color:#000;overflow:visible;height:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .deck{position:static;overflow:visible;height:auto}
    .slide{position:static;display:flex!important;opacity:1!important;break-after:page;padding:2cm;min-height:100vh;page-break-after:always;overflow:visible}
    .slide:last-child{break-after:auto;page-break-after:auto}
    .slide.active{opacity:1!important}
    .slide.wide{justify-content:flex-start;padding:2cm}
    .art{position:absolute;right:0;top:0;width:40%;height:auto;opacity:1!important}
    .counter-wrap,#auto-bar,.menu-btn,.menu-panel,.corner-tag,.notes{display:none!important}
    h1,h2,h3,h4,.sec-title,.qa-big{color:#000!important}
    .g,.g2,.g3{color:#000!important;background:none!important;padding:0}
    .kicker{color:#222!important}
    li::before{background:#000!important}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
    #auto-bar.running,#auto-bar.running.fast{animation:none!important}
  }

<div class="cm-bar">Комментарий: кликни по месту на слайде · клик по метке — удалить · Esc — выйти</div>
<script>
  const VIEW=(location.search.match(/[?&]view=(embed|presenter)/)||[])[1]||'';
  if(VIEW)document.documentElement.classList.add('sg-'+VIEW);
  const slides=Array.from(document.querySelectorAll('.slide'));
  const total=slides.length;
  let i=0;
  const counter=document.getElementById('counter');
  const counterFill=document.getElementById('counter-fill');
  const notes=document.getElementById('notes');
  const notesBody=document.getElementById('notes-body');
  function pad(n){return String(n).padStart(2,'0')}
  const SKEY='slide:'+location.pathname;
  function render(){
    slides.forEach((s,idx)=>s.classList.toggle('active',idx===i));
    counterFill.style.width=((i+1)/total*100)+'%';
    counter.textContent=pad(i+1)+' / '+pad(total);
    notesBody.textContent=slides[i].dataset.notes||'';
    if(!VIEW){try{sessionStorage.setItem(SKEY,i)}catch(e){}}
    if(typeof syncViews==='function')syncViews();  // не #slide-N в URL: Chromium хранит зум file:// по полному адресу → у каждого слайда был бы свой зум
  }
  // Auto-present
  let autoPlay=false,autoFast=false,autoTimer=null;
  const autoBtn=document.getElementById('auto-btn');
  const fastBtn=document.getElementById('fast-btn');
  const autoBar=document.getElementById('auto-bar');
  function restartAutoBar(){autoBar.classList.remove('running','fast');void autoBar.offsetWidth;autoBar.classList.add('running');if(autoFast)autoBar.classList.add('fast');}
  function stopAuto(){autoPlay=false;autoFast=false;clearTimeout(autoTimer);autoBar.classList.remove('running','fast');autoBtn.classList.remove('on');fastBtn.classList.remove('on');menuBtn.classList.remove('live','fast');}
  function tickAuto(){const delay=autoFast?7000:20000;autoTimer=setTimeout(()=>{if(!autoPlay)return;if(i<total-1){go(i+1,true);restartAutoBar();tickAuto();}else{stopAuto();}},delay);}
  function startAuto(fast){if(autoPlay)stopAuto();autoPlay=true;autoFast=!!fast;(fast?fastBtn:autoBtn).classList.add('on');menuBtn.classList.add('live');menuBtn.classList.toggle('fast',!!fast);restartAutoBar();tickAuto();}
  autoBtn.addEventListener('click',()=>{(autoPlay&&!autoFast)?stopAuto():startAuto(false);});
  fastBtn.addEventListener('click',()=>{(autoPlay&&autoFast)?stopAuto():startAuto(true);});
  function go(n,fromAuto){i=Math.max(0,Math.min(total-1,n));render();if(autoPlay&&!fromAuto){clearTimeout(autoTimer);restartAutoBar();tickAuto();}}
  function next(){go(i+1)}function prev(){go(i-1)}
  // Хоткеи: навигация — стрелки/пробел; служебное — только через Ctrl (не срабатывает случайно).
  // e.code — не зависит от раскладки (RU/EN). Cmd не перехватываем — остаются браузерные Cmd+F и т.п.
  document.addEventListener('keydown',e=>{
    if(e.ctrlKey&&!e.metaKey&&!e.altKey){
      const c=e.code;
      if(c==='KeyN'){e.preventDefault();notes.classList.toggle('show');}
      else if(c==='KeyP'){e.preventDefault();openPresenter();}
      else if(c==='KeyK'){e.preventDefault();toggleComments();}
      else if(c==='KeyF'){e.preventDefault();document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
      else if(c==='KeyB'||c==='Home'){e.preventDefault();go(0);}
      else if(c==='KeyE'||c==='End'){e.preventDefault();go(total-1);}
      return;
    }
    if(e.metaKey||e.altKey||VIEW==='embed'||e.target.closest?.('textarea'))return;
    if(e.key==='Escape'&&document.documentElement.classList.contains('sg-cm')){toggleComments(false);return;}
    switch(e.key){
      case 'ArrowRight':e.preventDefault();next();break;
      case 'ArrowLeft':e.preventDefault();prev();break;
      case 'Home':e.preventDefault();go(0);break;case 'End':e.preventDefault();go(total-1);break;
    }
  });
  document.getElementById('fs-btn').addEventListener('click',()=>{if(document.fullscreenElement){document.exitFullscreen()}else{document.documentElement.requestFullscreen()}menuPanel.classList.remove('open');menuBtn.setAttribute('aria-expanded','false');});
  const menuBtn=document.getElementById('menu-btn');
  const menuPanel=document.getElementById('menu-panel');
  menuBtn.addEventListener('click',e=>{e.stopPropagation();const open=menuPanel.classList.toggle('open');menuBtn.setAttribute('aria-expanded',open);});
  menuPanel.addEventListener('click',e=>e.stopPropagation());
  // ⋯ → «Обновить интерфейс»: settings server (skill slides-generator, LaunchAgent) rebuilds this file on the current template.html + config.json; reload keeps #slide-N
  const SG='http://127.0.0.1:7361',menuStatus=document.getElementById('menu-status');
  const say=(t,err)=>{menuStatus.textContent=t;menuStatus.className='menu-status show'+(err?' err':'');};
  document.getElementById('rebuild-btn').addEventListener('click',async e=>{
    e.stopPropagation();
    if(location.protocol!=='file:'){say('Обновление работает только для локального файла',1);return;}
    say('Обновляю…');
    try{
      const r=await fetch(SG+'/rebuild',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:decodeURIComponent(location.pathname)})});
      if(!r.ok)throw new Error(await r.text());
      location.reload();
    }catch(err){say(err instanceof TypeError?'Сервер настроек не отвечает. Запусти: python3 ~/.claude/skills/slides-generator/settings.py':'Ошибка: '+err.message,1);}
  });
  document.getElementById('settings-btn').addEventListener('click',()=>window.open(SG+'/','_blank'));
  document.addEventListener('click',()=>{menuPanel.classList.remove('open');menuBtn.setAttribute('aria-expanded','false');});
  let tx=null;
  document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX});
  document.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){dx<0?next():prev()}tx=null});
  document.getElementById('deck').addEventListener('click',e=>{if(VIEW||e.target.closest('button,a'))return;if(document.documentElement.classList.contains('sg-cm')){addComment(e);return;}if(e.clientX>window.innerWidth*.5)next();});
  // #slide-N при открытии (скриншоты, ссылки) → прыжок и сразу убрать хеш, чтобы адрес и зум были одни на весь деск; после reload — слайд из sessionStorage
  const dropHash=()=>history.replaceState(null,'',location.pathname+location.search);
  const _h=location.hash.match(/^#slide-(\d+)$/);
  let _s=null;try{_s=VIEW?(location.search.match(/[?&]s=(\d+)/)||[])[1]??null:sessionStorage.getItem(SKEY)}catch(e){}
  if(_h){i=Math.max(0,Math.min(total-1,parseInt(_h[1])-1));dropHash();}
  else if(_s!==null&&!isNaN(+_s))i=Math.max(0,Math.min(total-1,+_s));
  window.addEventListener('hashchange',()=>{const _m=location.hash.match(/^#slide-(\d+)$/);if(_m){i=Math.max(0,Math.min(total-1,parseInt(_m[1])-1));dropHash();render();}});

  // === Экран ведущего: второе окно (?view=presenter) — текущий и следующий слайд (iframe ?view=embed), заметки, таймер.
  // Окна общаются через postMessage (file:// — разные origin, прямой доступ к opener закрыт).
  let pw=null;const pvEl={};
  function openPresenter(){menuPanel.classList.remove('open');pw=window.open(location.pathname+'?view=presenter&s='+i,'sg-presenter','width=1280,height=800');}
  function syncViews(){
    if(document.documentElement.classList.contains('sg-cm'))cmPins();
    if(VIEW==='presenter'){if(pvEl.cur)pvSync();if(window.opener)window.opener.postMessage({sg:'go',i},'*');}
    else if(!VIEW&&pw&&!pw.closed)pw.postMessage({sg:'at',i},'*');
  }
  window.addEventListener('message',e=>{const d=e.data;if(!d||!d.sg)return;
    if(!VIEW&&d.sg!=='at')pw=e.source;          // после перезагрузки деска связь восстанавливается от экрана ведущего
    if((d.sg==='go'||d.sg==='at')&&+d.i!==i)go(+d.i);
    else if(d.sg==='hello'&&e.source)e.source.postMessage({sg:'at',i},'*');});
  if(VIEW==='presenter'){
    document.title='Ведущий · '+document.title;
    const src=n=>location.pathname+'?view=embed&s='+n;
    document.body.insertAdjacentHTML('beforeend',`<div id="pv"><div class="pv-top"><span class="pv-timer" title="Клик — пауза">00:00</span><button id="pv-reset">Сброс</button><span class="pv-clock"></span><span class="pv-num"></span></div>
      <div class="pv-col"><span class="pv-lbl">Сейчас</span><div class="pv-frame"><iframe id="pv-cur" src="${src(i)}"></iframe></div></div>
      <div class="pv-col"><span class="pv-lbl">Дальше</span><div class="pv-frame" id="pv-nf"><iframe id="pv-next" src="${src(Math.min(i+1,total-1))}"></iframe><div class="pv-end">Конец</div></div>
      <span class="pv-lbl">Заметки</span><div class="pv-notes"></div></div></div>`);
    Object.assign(pvEl,{cur:document.getElementById('pv-cur'),next:document.getElementById('pv-next'),nf:document.getElementById('pv-nf'),notes:document.querySelector('#pv .pv-notes'),num:document.querySelector('#pv .pv-num'),timer:document.querySelector('#pv .pv-timer'),clock:document.querySelector('#pv .pv-clock')});
    const fitPv=()=>document.querySelectorAll('#pv iframe').forEach(f=>f.style.transform=`scale(${f.parentElement.clientWidth/1280})`);
    addEventListener('resize',fitPv);fitPv();
    let t0=Date.now(),paused=0;
    pvEl.timer.onclick=()=>{paused?(t0+=Date.now()-paused,paused=0):(paused=Date.now());pvEl.timer.classList.toggle('paused',!!paused);};
    document.getElementById('pv-reset').onclick=()=>{t0=Date.now();if(paused)paused=t0;};
    const tick=()=>{const s=Math.floor(((paused||Date.now())-t0)/1000);pvEl.timer.textContent=pad(Math.floor(s/60))+':'+pad(s%60);pvEl.clock.textContent=new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});};
    setInterval(tick,500);tick();
    setInterval(()=>window.opener&&window.opener.postMessage({sg:'hello'},'*'),3000);
    window.pvSync=function(){
      pvEl.cur.contentWindow?.postMessage({sg:'go',i},'*');
      pvEl.next.contentWindow?.postMessage({sg:'go',i:Math.min(i+1,total-1)},'*');
      pvEl.nf.classList.toggle('end',i>=total-1);
      const n=slides[i].dataset.notes||'';pvEl.notes.textContent=n||'Заметок к этому слайду нет';pvEl.notes.classList.toggle('empty',!n);
      pvEl.num.textContent=pad(i+1)+' / '+pad(total);
    };
  }
  document.getElementById('presenter-btn').addEventListener('click',openPresenter);

  // === Комментарии к слайдам: правки «прямо на слайде» → <деск>.comments.json рядом с файлом (через сервер настроек);
  // потом /slides-generator fix <деск> применяет их все разом.
  let cmList=[];
  const cmPath=()=>decodeURIComponent(location.pathname);
  async function cmApi(body){
    const r=await fetch(SG+'/comments'+(body?'':'?path='+encodeURIComponent(cmPath())),body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:cmPath(),...body})}:{});
    if(!r.ok)throw new Error(await r.text());cmList=await r.json();cmPins();
  }
  function cmPins(){
    document.querySelectorAll('.cm-pin').forEach(p=>p.remove());
    const rc=slides[i].getBoundingClientRect();
    cmList.forEach((c,k)=>{if(c.slide!==i+1)return;
      const p=document.createElement('div');p.className='cm-pin';p.textContent=k+1;p.title=c.text+'\n(клик — удалить)';
      p.style.left=(rc.left+c.x/100*rc.width)+'px';p.style.top=(rc.top+c.y/100*rc.height)+'px';
      p.onclick=e=>{e.stopPropagation();cmApi({remove:c.id}).catch(err=>console.error(err));};
      document.body.appendChild(p);});
  }
  function toggleComments(on){
    menuPanel.classList.remove('open');
    on=document.documentElement.classList.toggle('sg-cm',on);
    document.querySelector('.cm-box')?.remove();
    if(on){if(location.protocol!=='file:'){toggleComments(false);return;}cmApi().catch(()=>{toggleComments(false);menuPanel.classList.add('open');say('Сервер настроек не отвечает. Запусти: python3 ~/.claude/skills/slides-generator/settings.py',1);});}
    else document.querySelectorAll('.cm-pin').forEach(p=>p.remove());
  }
  function addComment(e){
    document.querySelector('.cm-box')?.remove();
    const rc=slides[i].getBoundingClientRect(),x=+((e.clientX-rc.left)/rc.width*100).toFixed(1),y=+((e.clientY-rc.top)/rc.height*100).toFixed(1);
    const el=e.target.closest('h1,h2,h3,li,p,td,.card,.colcard,.pcard,.numcard,.demo-item,img,.art,.sec-title,.qa-big')||e.target;
    const target=el.closest('.art')?'иллюстрация '+((el.closest('.art').querySelector('use')||{}).getAttribute?.('href')||''):(el.textContent||'').replace(/\s+/g,' ').trim().slice(0,90);
    const heading=(slides[i].querySelector('h1,h2,.sec-title,.qa-big')?.textContent||'').replace(/\s+/g,' ').trim().slice(0,80);
    const box=document.createElement('div');box.className='cm-box';
    box.style.left=Math.min(e.clientX,innerWidth-320)+'px';box.style.top=Math.min(e.clientY+14,innerHeight-150)+'px';
    box.innerHTML='<textarea placeholder="Что поправить?"></textarea><div>Enter — сохранить · Shift+Enter — перенос · Esc — отмена</div>';
    box.onclick=ev=>ev.stopPropagation();document.body.appendChild(box);
    const ta=box.querySelector('textarea');ta.focus();
    ta.onkeydown=ev=>{ev.stopPropagation();
      if(ev.key==='Escape')box.remove();
      else if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();const text=ta.value.trim();if(!text){box.remove();return;}
        cmApi({add:{slide:i+1,x,y,text,target,heading}}).then(()=>box.remove()).catch(err=>{box.querySelector('div').textContent='Не сохранено: '+err.message;});}};
  }
  document.getElementById('comment-btn').addEventListener('click',e=>{e.stopPropagation();toggleComments();});
  addEventListener('resize',()=>{if(document.documentElement.classList.contains('sg-cm'))cmPins();});
  render();

  // Раскрытие из превью индекса: деск стартует в прямоугольнике карточки и вырастает на весь экран (FLIP)
  (function(){
    const m=location.search.match(/[?&]from=([\d.]+),([\d.]+),([\d.]+),([\d.]+)/);if(!m)return;
    const [x,y,w,h]=m.slice(1).map(Number),b=document.body,de=document.documentElement;
    const clean=()=>history.replaceState(null,'',location.pathname+location.hash);
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){de.classList.remove('opening');clean();return;}
    Object.assign(b.style,{transformOrigin:'0 0',transform:`translate(${x*innerWidth}px,${y*innerHeight}px) scale(${w},${h})`,
      clipPath:`inset(0 round ${14/w}px ${14/w}px ${14/w}px ${14/w}px / ${14/h}px ${14/h}px ${14/h}px ${14/h}px)`});
    de.classList.remove('opening');b.getBoundingClientRect();
    requestAnimationFrame(()=>{
      b.style.transition='transform .6s cubic-bezier(.2,0,0,1), clip-path .6s cubic-bezier(.2,0,0,1)';
      b.style.transform='none';b.style.clipPath='inset(0 round 0)';
    });
    setTimeout(()=>{Object.assign(b.style,{transition:'',transform:'',transformOrigin:'',clipPath:''});clean();},700);
  })();
</script>
</body>
</html>
